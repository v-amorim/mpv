### Profiles ###

[Animation] # Apply when file path contains "\Animation\"
profile-cond=require 'mp.utils'.join_path(working_directory, path):match('\\Animation\\')
profile-restore=copy-equal                           # Restore only options changed by this profile (preserve equal values)

# Optimized Anime4K shader chain (execution order matters: pre → restore → upscale → post)
glsl-shaders="~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl"

# Force ASS styling (overrides embedded subtitle styles)
sub-ass-style-overrides=FontName="Impress BT Pace"   # Override ASS style font name
sub-font="Impress BT Pace"                           # Fallback font if not defined in ASS
sub-ass-override=yes                                 # Enable overriding embedded ASS styles
sub-font-size=54                                     # Subtitle size (scaled units)
sub-border-size=3.5                                  # Outline thickness
sub-margin-x=20                                      # Horizontal margin
sub-margin-y=36                                      # Vertical margin (bottom offset)
sub-spacing=0                                        # Character spacing
sub-auto=fuzzy                                       # Auto-load loosely matching subtitle files
sub-color="#FFFFFF"                                # Primary subtitle color
sub-border-color="#000000"                         # Outline color
sub-codepage="UTF-8"                                 # Default encoding for text subtitles


[interpolation-activate] # Activate when interpolation is enabled (runtime property)
profile-cond=get("interpolation")
profile-restore=copy                                 # Restore all modified options when profile deactivates
video-sync=display-resample                          # Required sync mode for interpolation (smooth timing)


[audio-file]
profile-cond=(path and path:match("%.(mp3|flac|wav|m4a|ogg|opus)$"))  # Apply to audio-only file extensions
profile-restore=copy                                                  # Restore all modified options on exit
loop-playlist=inf                                                     # Loop playlist indefinitely
video=no                                                              # Disable video output (audio-only mode)


[auto-upscale] # Apply when upscaling factor ≥ 1.4x and NOT in Animation path
profile-cond=((get("display-width") / get("width") >= 1.4)) and not (path:match("\\Animation\\"))
profile-restore=copy                                 # Restore options when condition no longer matches
scale=ewa_lanczossharp                               # High-quality upscaling filter (sharp, anti-ringing)
