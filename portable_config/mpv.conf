## =========================
## {General}
## =========================

include="~~/profiles.conf"            # Load additional config profiles from mpv config dir
gpu-shader-cache-dir="~~/cache/shader_cache"  # Cache compiled GPU shaders to disk
screenshot-template="~/Pictures/Screenshots/%f-%wH.%wM.%wS.%wT-#%#00n"  # Filename format for screenshots
input-ipc-server=mpvpipe              # Enable IPC socket for external control (scripts, SVP, etc.)
log-file="~~/mpv.log"                 # Write runtime log file to config directory
msg-color=yes                         # Enable colored terminal log output
priority=abovenormal                  # Raise process priority (may improve stability under load)

hr-seek=yes                           # Enable precise (keyframe-independent) seeking
hr-seek-framedrop=no                  # Do not drop frames after seek (ensures visual accuracy)


msg-level=all=info,display-tags=warn  # Set log verbosity: info globally, warn for display-tags


## =========================
## {Video}
## =========================

profile=high-quality                  # Built-in high-quality preset (scaling, debanding, etc.)
vo=gpu-next                           # Next-gen GPU video output (libplacebo-based)

gpu-api=d3d11                         # Force d3d11 backend (not automatic; overrides auto selection)
gpu-context=auto                      # Auto-select context for chosen GPU API

hwdec=auto-safe                       # Enable hardware decoding with safe fallback (copy-back if needed)
hwdec-codecs=all                      # Allow hw decoding for all supported codecs

vd-lavc-dr=yes                        # Enable direct rendering (reduces memory copies, improves performance)


## ---- Scaling & Sharpness ----

scale-antiring=0.6                    # Reduce ringing artifacts during luma upscaling
cscale-antiring=0.6                   # Reduce ringing during chroma upscaling
dscale-antiring=0.6                   # Reduce ringing during downscaling


## ---- Smooth Playback ----

video-sync=display-resample           # Sync video to display clock using resampling (smooth playback)
video-sync-max-video-change=5         # Allow small speed adjustments to maintain sync
interpolation=no                      # Disable interpolation (external tools like SVP handle it)
tscale=oversample                     # Frame blending kernel for interpolation/resampling

video-sync-max-factor=1               # Limit playback speed correction range (1 = strict, minimal deviation)


## ---- Color & Tone Mapping ----

target-prim=bt.709                    # Output color primaries (standard SDR gamut)
target-trc=bt.1886                    # Output transfer curve (gamma for SDR displays)

tone-mapping=bt.2390                  # HDR → SDR tone mapping algorithm (recommended standard)
#tone-mapping-mode=auto               # Removed in this mpv/libplacebo build (option not found); now automatic
tone-mapping-param=0.7                # Strength parameter (affects highlight compression)

gamut-mapping-mode=clip               # Clip out-of-gamut colors (can cause saturation loss)

hdr-compute-peak=yes                  # Dynamically estimate peak brightness per scene/frame


## ---- Debanding ----

deband=yes                            # Enable debanding filter (reduces color banding)
deband-iterations=2                   # Number of debanding passes
deband-threshold=40                   # Detection threshold (higher = more aggressive)
deband-range=16                       # Spatial range of filter
deband-grain=8                        # Add grain to mask banding artifacts


## =========================
## {Audio}
## =========================

## ---- Language Preference ----

alang=jp,jpn,jp_JP,jp_JP.UTF-8,ja,jap,Japanese,chi,zho,zh,ru,rus    # Preferred audio languages (priority order)
slang=en,eng,en_US,en_US.UTF-8,English                              # Preferred subtitle languages


## ---- Processing ----

af=dynaudnorm=f=250:g=21:p=0.45:m=8:r=0.9   # Dynamic audio normalization filter (real-time loudness leveling); g must be odd
audio-pitch-correction=yes                  # Preserve pitch when playback speed changes


## =========================
## {Subtitles}
## =========================

sub-auto=fuzzy                        # Auto-load subtitles with approximate filename match
subs-with-matching-audio=no           # Do not restrict subs to match audio language

sub-file-paths="sub;subs;subtitles"   # Relative directories to search for external subtitles

sub-codepage="UTF-8"                  # Default encoding for text subtitles
sub-font="Roboto Medium"              # Font for rendered subtitles
sub-font-size=54                      # Subtitle font size (in scaled units)

sub-color="#FFFFFF"                 # Primary subtitle color
sub-border-color="#000000"          # Outline color
sub-border-size=2.5                   # Outline thickness

sub-shadow-color="#000000"          # Shadow color
sub-spacing=0                         # Character spacing adjustment

sub-margin-x=20                       # Horizontal margin from screen edges
sub-margin-y=36                       # Vertical margin from bottom

sub-fix-timing=yes                    # Attempt to fix broken subtitle timestamps
demuxer-mkv-subtitle-preroll=yes      # Preload subtitles to avoid missing early lines
blend-subtitles=yes                   # Blend subtitles in linear light (better visual quality)

sub-ass-use-video-data=all            # Allow ASS subtitles to use video color/scale data
embeddedfonts=yes                     # Load fonts embedded in subtitle files


## =========================
## {OSC / OSD}
## =========================

osc=no                                # Disable built-in on-screen controller
osd-bar=no                            # Disable OSD progress bar

osd-font='JetBrains Mono'             # Font used for OSD text
osd-font-size=37                      # OSD font size
osd-bold=yes                          # Use bold font for OSD
osd-fractions=yes                     # Show fractional values (e.g. time/volume precision)

border=no                             # Disable window decorations (borderless window)
geometry=60%x60%                      # Initial window size relative to screen

volume=56                             # Default startup volume
volume-max=150                        # Maximum allowed volume (software amplification)

save-position-on-quit=no              # Do not store playback position for resume

autofit-larger=80%x80%                # Max window size when scaling up video
autofit-smaller=20%x20%               # Min window size when scaling down video


## =========================
## {Cache / Performance}
## =========================

cache=yes                             # Enable demuxer read-ahead cache
cache-secs=20                         # Target cache duration in seconds

demuxer-max-back-bytes=100M           # Max backward buffer for seeking
demuxer-max-bytes=200M                # Max forward buffer size
