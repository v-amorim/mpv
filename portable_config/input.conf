F4                  script-binding sub-seek-list                                                       #! Subtitle > Seek to Line @manage_search ?Lists every subtitle line; pick one to jump straight to it
CTRL+r              sub-reload                                                                         #! Subtitle > Reload External @refresh ?Re-read the subtitle file, picking up edits made while playing
F12 script-binding  export-selected-subtitles                                                          #! Subtitle > Export Selected @save_alt ?Write the active subtitle track next to the video file
