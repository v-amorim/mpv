F8                  cycle-values   sub-ass-style-overrides "FontName=Roboto Medium" "FontName=Impress BT Pace" "FontName=Open Sans Semibold" "FontName=Noto Sans ExtraBold" "" #! Subtitle > Font @text_fields ?Override the typeface the subtitles ask for > Cycle @loop ?Step through the four fonts below, one press at a time
# set               sub-ass-style-overrides ""                                                         #! Subtitle > Font > Default @restart_alt ?Stop overriding and let the subtitle file style itself
