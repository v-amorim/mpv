# set               sub-ass-style-overrides "FontName=Roboto Medium";                                  #! Subtitle > Font > Roboto Medium @font_download ?Neutral and quiet, the safe pick for anything
# set               sub-ass-style-overrides "FontName=Impress BT Pace";                                #! Subtitle > Font > Impress BT Pace @font_download ?Condensed, fits long lines without shrinking them
# set               sub-ass-style-overrides "FontName=Open Sans Semibold";                             #! Subtitle > Font > Open Sans Semibold @font_download ?Rounder and heavier, easy to read from the couch
# set               sub-ass-style-overrides "FontName=Noto Sans ExtraBold";                            #! Subtitle > Font > Noto Sans ExtraBold @font_download ?The heaviest option, for bright scenes that swallow text

